
name: FoRgE Unified Windows Build
on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "Engine/**"
      - "Client/**"
      - "Studio/**"
      - "tools/**"
      - "WebSite/public/fonts/**"
      - "WebSite/public/icons/**"
      - ".github/workflows/studio-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-unified-windows
  cancel-in-progress: true
jobs:
  build-windows-x64:
    name: Generate assets, build engine, studio and client
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install asset tools
        run: python -m pip install --disable-pip-version-check fonttools pillow brotli
      - name: Generate FoRgE brand fonts and application icon
        run: python tools/build_brand_assets.py
      - name: Generate default player texture
        run: python tools/build_player_texture.py
      - name: Verify generated assets
        shell: pwsh
        run: |
          $weights = 300,400,500,600,700,800,900
          foreach ($weight in $weights) {
            $font = "WebSite/public/fonts/forge-$weight.ttf"
            if (!(Test-Path $font)) { throw "Missing generated font: $font" }
          }
          if (!(Test-Path "WebSite/public/icons/forge.ico")) { throw "Missing FoRgE icon." }
          if (!(Test-Path "Engine/assets/player_texture.png")) { throw "Missing player texture." }
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile nuget.exe
          .\nuget.exe install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory packages -ExcludeVersion
          if (!(Test-Path "packages/Microsoft.Web.WebView2/build/native/include/WebView2.h")) { throw "WebView2 headers missing." }
          if (!(Test-Path "packages/Microsoft.Web.WebView2/build/native/x64/WebView2LoaderStatic.lib")) { throw "WebView2 x64 loader missing." }
      - name: Configure native C++ projects
        shell: pwsh
        run: |
          $sdk = (Resolve-Path "packages/Microsoft.Web.WebView2/build/native").Path
          cmake -S . -B build -A x64 "-DWEBVIEW2_SDK_DIR=$sdk"
      - name: Build Studio, Player and WebView2 Client
        run: cmake --build build --config Release --parallel
      - name: Verify complete package
        shell: pwsh
        run: |
          $package = "build/FoRgE-Windows-x64"
          foreach ($exe in @("FoRgEStudio.exe","FoRgEPlayer.exe","FoRgEClient.exe")) {
            if (!(Test-Path "$package/$exe")) { throw "Package executable missing: $exe" }
          }
          if (!(Test-Path "$package/Resources/player_texture.png")) { throw "Player texture missing from package." }
          if (!(Test-Path "$package/Resources/Icons/forge.ico")) { throw "Application icon missing from package." }
          if ((Get-ChildItem "$package/Resources/Fonts/forge-*.ttf").Count -ne 7) { throw "Expected all seven FoRgE font weights." }
          Get-ChildItem $package -Recurse | Select-Object FullName,Length
      - name: Upload FoRgE Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: FoRgE-Windows-x64
          path: build/FoRgE-Windows-x64/
          if-no-files-found: error
          retention-days: 14
